services:
  kafka:
    container_name: kafka
    image: apache/kafka:4.1.1
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:19092,HOST://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:19092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s

  kafka-init:
    container_name: kafka-init
    image: apache/kafka:4.1.1
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092
        --create --if-not-exists --topic flousflow.transactions
        --partitions 3 --replication-factor 1
    restart: 'no'

  minio:
    container_name: minio
    image: flousflow/minio:2025-04-22
    pull_policy: never
    profiles: [bronze, silver, serving]
    build:
      context: .
      dockerfile: infra/docker/minio.Dockerfile
      target: server
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - >-
        : "$${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env}" "$${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}";
        exec minio server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-}
    ports:
      - '127.0.0.1:9000:9000'
      - '127.0.0.1:9001:9001'
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "minio-healthcheck"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio-init:
    container_name: minio-init
    image: flousflow/mc:2025-04-16
    pull_policy: never
    profiles: [bronze, silver, serving]
    build:
      context: .
      dockerfile: infra/docker/minio.Dockerfile
      target: client
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-}
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - >-
        : "$${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env}" "$${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}";
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD";
        mc mb --ignore-existing local/flousflow

  bronze:
    container_name: bronze
    profiles: [bronze, silver]
    build:
      context: .
      dockerfile: infra/docker/spark.Dockerfile
      target: ingestion
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-}
      FLOUSFLOW_KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      FLOUSFLOW_KAFKA_TOPIC: flousflow.transactions
      FLOUSFLOW_S3_ENDPOINT: http://minio:9000
      FLOUSFLOW_BRONZE_PATH: s3a://flousflow/bronze/transactions
      FLOUSFLOW_BRONZE_CHECKPOINT: /checkpoints/bronze-transactions
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
    volumes:
      - spark-checkpoints:/checkpoints
      - spark-ivy:/opt/spark/ivy
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/bronze-ready"]
      interval: 5s
      timeout: 5s
      retries: 120
      start_period: 30s
    stop_grace_period: 60s

  silver:
    container_name: silver
    profiles: [silver]
    build:
      context: .
      dockerfile: infra/docker/spark.Dockerfile
      target: ingestion
    command: ["/opt/flousflow/spark/silver/ingest.py"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-}
      FLOUSFLOW_S3_ENDPOINT: http://minio:9000
      FLOUSFLOW_BRONZE_PATH: s3a://flousflow/bronze/transactions
      FLOUSFLOW_SILVER_PATH: s3a://flousflow/silver/transactions
      FLOUSFLOW_SILVER_REJECTS: s3a://flousflow/silver/rejected
      FLOUSFLOW_SILVER_CONFLICTS: s3a://flousflow/silver/conflicts
      FLOUSFLOW_SILVER_AUDIT: s3a://flousflow/silver/audit
      FLOUSFLOW_SILVER_CHECKPOINT: /checkpoints/silver-transactions
    depends_on:
      bronze:
        condition: service_healthy
    volumes:
      - spark-checkpoints:/checkpoints
      - spark-ivy:/opt/spark/ivy
      - gold-lock:/locks
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/silver-ready"]
      interval: 5s
      timeout: 5s
      retries: 120
      start_period: 30s
    stop_grace_period: 60s

  postgres:
    container_name: postgres
    image: postgres:17.7-alpine
    profiles: [serving]
    environment:
      POSTGRES_DB: flousflow
      POSTGRES_USER: flousflow_admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      FLOUSFLOW_POSTGRES_LOADER_PASSWORD: ${FLOUSFLOW_POSTGRES_LOADER_PASSWORD:-}
      FLOUSFLOW_POSTGRES_READER_PASSWORD: ${FLOUSFLOW_POSTGRES_READER_PASSWORD:-}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init.sh:/docker-entrypoint-initdb.d/init.sh:ro,z
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flousflow_admin -d flousflow"]
      interval: 5s
      timeout: 5s
      retries: 20

  serving:
    profiles: [serving]
    build:
      context: .
      dockerfile: infra/docker/spark.Dockerfile
      target: serving
    command: ["/opt/flousflow/spark/serving/refresh.py"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-}
      FLOUSFLOW_POSTGRES_LOADER_PASSWORD: ${FLOUSFLOW_POSTGRES_LOADER_PASSWORD:-}
      FLOUSFLOW_POSTGRES_READER_PASSWORD: ${FLOUSFLOW_POSTGRES_READER_PASSWORD:-}
      FLOUSFLOW_REFRESH_REPLAY_ID: ${FLOUSFLOW_REFRESH_REPLAY_ID:-}
      FLOUSFLOW_REFRESH_EXPECTED_COUNT: ${FLOUSFLOW_REFRESH_EXPECTED_COUNT:-}
      FLOUSFLOW_REFRESH_WAIT_SECONDS: ${FLOUSFLOW_REFRESH_WAIT_SECONDS:-600}
    depends_on:
      minio-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    volumes:
      - spark-ivy:/opt/spark/ivy
      - gold-lock:/locks

volumes:
  gold-lock:
  postgres-data:
  kafka-data:
  minio-data:
  spark-checkpoints:
  spark-ivy:

networks:
  default:
    name: flousflow
