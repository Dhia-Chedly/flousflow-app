[build-system]
requires = ["setuptools>=77,<78"]
build-backend = "setuptools.build_meta"

[project]
name = "flousflow-producer"
version = "0.1.0"
description = "Transaction replay producer for the FlousFlow financial analytics lakehouse"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = ["confluent-kafka>=2.6,<3"]

[project.scripts]
flousflow-producer = "flousflow_producer.__main__:main"

[tool.setuptools.packages.find]
where = ["producer/src"]
include = ["flousflow_producer*"]
